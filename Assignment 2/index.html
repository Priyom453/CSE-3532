<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Activity Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>Student Activity Dashboard</h1>
      <p>Use this dashboard to manage student activities: add students, search them, change their status, and remove them.</p>
      <button id="darkModeToggle" class="btn-toggle">🌙 Dark Mode</button>
    </header>

    <section class="stats">
      <div class="stat-card stat-total">
        <span class="stat-label">TOTAL STUDENTS</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-card stat-active">
        <span class="stat-label">ACTIVE STUDENTS</span>
        <span class="stat-value" id="activeCount">0</span>
      </div>
      <div class="stat-card stat-inactive">
        <span class="stat-label">INACTIVE STUDENTS</span>
        <span class="stat-value" id="inactiveCount">0</span>
      </div>
    </section>

    <section class="card">
      <h2>Add a New Student</h2>
      <form id="studentForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="e.g. John Doe" required>

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="e.g. CSE-101" required>

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="e.g. CSE" required>

        <label for="status">Status</label>
        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <button type="submit" class="btn-primary">+ Add Student</button>
      </form>
    </section>

    <section class="card">
      <h2>Students</h2>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name or ID...">

      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="inactive">Inactive</button>
      </div>

      <div id="studentList" class="student-list"></div>

      <p id="emptyState" class="empty-state">
        No students added yet.<br>
        <span>Add your first student using the form above.</span>
      </p>
    </section>

  </div>

<script src="script.js"></script>
</body>
</html>
